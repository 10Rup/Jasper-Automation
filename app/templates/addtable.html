{% extends "base.html" %}

{% block styles %}

<style>

/* ================= MAIN ================= */

.main{
    margin-left:260px;
    padding:30px;
}

/* ================= CARD ================= */

.form-card{
    background:white;
    border-radius:24px;
    padding:35px;
    box-shadow:0 8px 30px rgba(0,0,0,0.05);
}

.form-title{
    font-size:40px;
    font-weight:700;
    color:#0f172a;
    margin-bottom:8px;
}

.form-desc{
    color:#64748b;
    margin-bottom:35px;
    font-size:16px;
}

/* ================= GRID ================= */

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

.full-width{
    grid-column:1/-1;
}

/* ================= LABEL ================= */

label{
    display:block;
    margin-bottom:10px;
    font-weight:600;
    color:#334155;
}

/* ================= INPUT ================= */

.input-box,
.select-box,
textarea{
    width:100%;
    padding:15px 18px;
    border:1px solid #dbeafe;
    border-radius:14px;
    background:#f8fafc;
    font-size:15px;
    transition:0.3s;
}

.input-box:focus,
.select-box:focus,
textarea:focus{
    outline:none;
    border-color:#7c3aed;
    box-shadow:0 0 0 4px rgba(124,58,237,0.12);
    background:white;
}

textarea{
    resize:none;
}

/* ================= RADIO ================= */

.radio-group{
    display:flex;
    gap:30px;
    margin-top:10px;
    margin-bottom:10px;
}

.radio-option{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:600;
    color:#334155;
}

.radio-option input{
    width:18px;
    height:18px;
    accent-color:#7c3aed;
}

/* ================= COLUMN SECTION ================= */

.columns-wrapper{
    margin-top:20px;
}

.column-row{
    display:flex;
    gap:15px;
    margin-bottom:15px;
    align-items:center;
}

.column-row input{
    flex:1;
}

.column-row select{
    width:220px;
}

/* REMOVE BTN */

.remove-btn{
    width:48px;
    height:48px;
    border:none;
    border-radius:12px;
    background:#ef4444;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

.remove-btn:hover{
    background:#dc2626;
}

/* ================= BUTTONS ================= */

.add-column-btn{
    background:#10b981;
    color:white;
    border:none;
    padding:14px 24px;
    border-radius:12px;
    font-weight:600;
    cursor:pointer;
    margin-top:10px;
    transition:0.3s;
}

.add-column-btn:hover{
    background:#059669;
}

.btn-group{
    display:flex;
    justify-content:flex-end;
    gap:15px;
    margin-top:40px;
}

.btn{
    padding:14px 28px;
    border:none;
    border-radius:14px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.btn-cancel{
    background:#ef4444;
    color:white;
}

.btn-save{
    background:linear-gradient(135deg,#6d28d9,#9333ea);
    color:white;
}

.btn:hover{
    transform:translateY(-2px);
}

/* ================= HIDE ================= */

.hidden{
    display:none;
}

</style>

{% endblock %}



{% block content %}

<main class="main">

    <!-- HEADER -->
    <header class="header">

        <h2>Add Table Structure</h2>

        <div class="avatar">
            REPORT TEAM
        </div>

    </header>

    <!-- FORM -->
    <section class="form-card">

        <h2 class="form-title">
            Database Configuration
        </h2>

        <p class="form-desc">
            Configure database, table structure and column information for Jasper Automation.
        </p>

        <form id="tableForm">

            <div class="form-grid">

                <!-- DATABASE -->
                <div>

                    <label>Database Name</label>

                    <input
                        type="text"
                        class="input-box"
                        placeholder="Enter Database Name"
                    >

                </div>

                <!-- TABLE -->
                <div>

                    <label>Table Name</label>

                    <input
                        type="text"
                        class="input-box"
                        placeholder="Enter Table Name"
                    >

                </div>

                <!-- DESCRIPTION -->
                <div class="full-width">

                    <label>Description</label>

                    <textarea
                        rows="4"
                        placeholder="Write description about this table..."
                    ></textarea>

                </div>

                <!-- RADIO -->
                <div class="full-width">

                    <label>Add Columns Method</label>

                    <div class="radio-group">

                        <label class="radio-option">

                            <input
                                type="radio"
                                name="column_method"
                                value="bulk"
                                checked
                                onchange="toggleColumnMode()"
                            >

                            Bulk Add Columns

                        </label>

                        <label class="radio-option">

                            <input
                                type="radio"
                                name="column_method"
                                value="manual"
                                onchange="toggleColumnMode()"
                            >

                            Manual Add Columns

                        </label>

                    </div>

                </div>

                <!-- BULK -->
                <div class="full-width" id="bulkSection">

                    <label>
                        Bulk Add Columns
                    </label>

                    <textarea
                        rows="5"
                        id="bulkColumns"
                        placeholder="name,email,phone,address"
                    ></textarea>

                </div>

                <!-- MANUAL -->
                <div class="full-width hidden" id="manualSection">

                    <label>Manual Add Columns</label>

                    <div class="columns-wrapper" id="columnsWrapper">

                        <div class="column-row">

                            <input
                                type="text"
                                class="input-box"
                                placeholder="Column Name"
                            >

                            <select class="select-box">

                                <option>VARCHAR</option>
                                <option>TEXT</option>
                                <option>INTEGER</option>
                                <option>FLOAT</option>
                                <option>BOOLEAN</option>
                                <option>DATE</option>
                                <option>DATETIME</option>

                            </select>

                            <button
                                type="button"
                                class="remove-btn"
                                onclick="removeColumn(this)"
                            >
                                <i class="fas fa-trash"></i>
                            </button>

                        </div>

                    </div>

                    <button
                        type="button"
                        class="add-column-btn"
                        onclick="addColumn()"
                    >
                        <i class="fas fa-plus"></i>
                        Add Column
                    </button>

                </div>

            </div>

            <!-- BUTTONS -->
            <div class="btn-group">

                <button
                    type="button"
                    class="btn btn-cancel"
                    onclick="resetForm()"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="btn btn-save"
                >
                    Save Structure
                </button>

            </div>

        </form>

    </section>

</main>

<script>

/* ================= TOGGLE ================= */

function toggleColumnMode(){

    const selected =
        document.querySelector(
            'input[name="column_method"]:checked'
        ).value;

    const bulk =
        document.getElementById("bulkSection");

    const manual =
        document.getElementById("manualSection");

    if(selected === "bulk"){

        bulk.classList.remove("hidden");
        manual.classList.add("hidden");

    }else{

        manual.classList.remove("hidden");
        bulk.classList.add("hidden");

    }
}

/* ================= ADD COLUMN ================= */

function addColumn(){

    const wrapper =
        document.getElementById("columnsWrapper");

    const div =
        document.createElement("div");

    div.className = "column-row";

    div.innerHTML = `
    
        <input
            type="text"
            class="input-box"
            placeholder="Column Name"
        >

        <select class="select-box">

            <option>VARCHAR</option>
            <option>TEXT</option>
            <option>INTEGER</option>
            <option>FLOAT</option>
            <option>BOOLEAN</option>
            <option>DATE</option>
            <option>DATETIME</option>

        </select>

        <button
            type="button"
            class="remove-btn"
            onclick="removeColumn(this)"
        >
            <i class="fas fa-trash"></i>
        </button>
    
    `;

    wrapper.appendChild(div);
}

/* ================= REMOVE ================= */

function removeColumn(btn){

    btn.parentElement.remove();
}

/* ================= RESET ================= */

function resetForm(){

    document.getElementById("tableForm").reset();

}

/* ================= SUBMIT ================= */

document
.getElementById("tableForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    alert("Table Structure Saved Successfully");

});

</script>

{% endblock %}
