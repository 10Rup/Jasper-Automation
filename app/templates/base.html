<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}jasper Automation{% endblock %}</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            background: #f3f4f6;
        }

        /* ===== LAYOUT ===== */
        .app {
            display: flex;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 240px;
            height: 100vh;
            background: white;
            position: fixed;
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.05);
        }

        .logo {
            color: #6d28d9;
            margin-bottom: 20px;
        }

        .sidebar nav a {
            display: block;
            padding: 10px;
            margin: 6px 0;
            border-radius: 10px;
            text-decoration: none;
            color: #334155;
            transition: 0.3s;
        }

        .sidebar nav a:hover,
        .sidebar nav a.active {
            background: linear-gradient(135deg, #6d28d9, #9333ea);
            color: white;
        }


        .avatar {
        padding: 8px 20px;
        background: #1f86dc;
        color: white;
        border-radius: 20px;
        font-weight: bold;
        }
         /* HEADER */
        .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: white;
        padding: 15px;
        border-radius: 12px;
        }


    </style>

    <!-- Page-specific styles -->
    {% block styles %}{% endblock %}
    
</head>

<body>

    <div class="app">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <h2 class="logo">Jasper Automation</h2>

            <nav>
                <a href="/" class="active">🏠 Dashboard</a>
                <a href="/api/settings">🔑 API Settings</a>
                <a href="/upload/sample">📤 Upload</a>
                <a href="/reports/">📊 Reports</a>
            </nav>
        </aside>

        
        
    </div>

    {% block content %}
        
    {% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
