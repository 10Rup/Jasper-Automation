{% extends "base.html" %}
{% block content %}

{% block styles %}
  <style>
    .main {
      margin-left: 260px;
      padding: 20px;
    }
    
    /* ===== SECTION TITLES ===== */
    .section-title {
      margin-top: 30px;
      margin-bottom: 20px;
      font-size: 1.5rem;
      font-weight: 600;
      color: #374151;
      border-left: 5px solid #6d28d9;
      padding-left: 12px;
    }

    /* ===== CARDS GRID ===== */
    .card-grid {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }
    
    .card-grid a {
      text-decoration: none;
      cursor: pointer;
    }

    .card {
      width: 220px;
      height: 160px;
      border-radius: 16px;
      background: linear-gradient(135deg, #14b8a6, #0ea5a4);
      color: white;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    /* ICON */
    .card .icon {
      width: 60px;
      height: 60px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      font-size: 24px;
      transition: background 0.35s;
    }

    /* TEXT */
    .card p {
      font-weight: bold;
      font-size: 0.95rem;
      margin: 0;
    }

    /* HOVER EFFECT */
    .card:hover {
      transform: translateY(-8px) scale(1.03);
      background: linear-gradient(135deg, #6d28d9, #9333ea);
      box-shadow: 0 10px 15px -3px rgba(109, 40, 217, 0.3), 0 4px 6px -2px rgba(109, 40, 217, 0.15);
    }

    .card:hover .icon {
      background: rgba(255, 255, 255, 0.3);
    }

    /* RIPPLE */
    .card span {
      position: absolute;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      transform: scale(0);
      animation: ripple 0.6s linear;
    }

    @keyframes ripple {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }
  </style>
{% endblock %}

<main class="main">

  <header class="header">
    <h2>Report Section</h2>
    <div class="header-right">
      <div class="avatar">REPORT TEAM</div>
    </div>
  </header>

  <section>
    <h3 class="section-title">Process Section</h3>
    <div class="card-grid">
      
      <a href="/reports/pdf-img">
        <div class="card">
          <div class="icon"><i class="fas fa-file-pdf"></i></div>
          <p>PDF/Image Reports</p>
        </div>
      </a>

      <a href="/reports/excel">
        <div class="card">
          <div class="icon"><i class="fas fa-file-excel"></i></div>
          <p>Excel Report</p>
        </div>
      </a>

      <a href="/reports/html">
        <div class="card">
          <div class="icon"><i class="fas fa-code"></i></div>
          <p>HTML Reports</p>
        </div>
      </a>

    </div>
  </section>

  <section>
    <h3 class="section-title">Compile Section</h3>
    <div class="card-grid">
      
      <a href="/reports/compile">
        <div class="card">
          <div class="icon"><i class="fas fa-layer-group"></i></div>
          <p>Combined Reports</p>
        </div>
      </a>

    </div>
  </section>
 <!-- Table Setting section-->
    <section>
    <h3 class="section-title">Table Setting</h3>
    <div class="card-grid">
      
      <a href="/tables/">
        <div class="card">
          <div class="icon"><i class="fas fa-layer-group"></i></div>
          <p>Add Table Structure</p>
        </div>
      </a>

    </div>
  </section>

</main>

<script>
  // Ripple Effect
  document.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", function(e) {
      let ripple = document.createElement("span");
      ripple.style.left = e.offsetX + "px";
      ripple.style.top = e.offsetY + "px";
      this.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    });
  });
</script>

{% endblock %}
