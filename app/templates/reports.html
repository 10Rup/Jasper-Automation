{% extends "base.html" %}
{% block content %}


{% block styles %}
  <style>
    .main {
        margin-left: 260px;
        padding: 20px;
      }
        /* ===== TABS ===== */
      .tabs {
        margin: 20px 0;
      }

      .tabs button {
        padding: 8px 16px;
        border-radius: 20px;
        border: none;
        background: #e5e7eb;
        cursor: pointer;
      }

      .active-tab {
        background: #f97316;
        color: white;
      }

      /* ===== SECTION ===== */
      .section-title {
        margin-bottom: 20px;
        border-left: 4px solid orange;
        padding: 10px;
      }

      /* ===== CARDS ===== */
      .card-grid {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
      }

      .card {
        width: 220px;
        height: 160px;
        border-radius: 16px;
        background: linear-gradient(135deg, #14b8a6, #0ea5a4);
        color: white;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        cursor: pointer;
        transition: 0.35s;
        position: relative;
        overflow: hidden;
      }

      /* ICON */
      .icon {
        width: 60px;
        height: 60px;
        background: rgba(255,255,255,0.2);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 10px;
        font-size: 22px;
      }

      /* TEXT */
      .card p {
        font-weight: bold;
      }

      /* HOVER EFFECT */
      .card:hover {
        transform: translateY(-8px) scale(1.05);
        background: linear-gradient(135deg, #6d28d9, #9333ea);
      }

      /* RIPPLE */
      .card span {
        position: absolute;
        background: rgba(255,255,255,0.5);
        border-radius: 50%;
        transform: scale(0);
        animation: ripple 0.6s linear;
      }

      @keyframes ripple {
        to {
          transform: scale(4);
          opacity: 0;
        }
      }

  </style>

{% endblock %}

<!-- MAIN -->
<main class="main">

    <header class="header">
        <h2 class="header" >New Reports</h2>
      <div class="header-right">
        <div class="avatar">REPORT TEAM</div>
      </div>
    </header>

<!-- <div class="tabs">
  <button class="active-tab">Report Section</button>
</div> -->

<section>
  <h3 class="section-title">Report Section</h3>

  <div class="card-grid">

    <a href="/reports/pdf"  >
    <div class="card">
      <div class="icon"><i class="fas fa-file-pdf"></i></div>
      <p>PDF Report</p>
    </div>
  </a>

    <div class="card">
      <div class="icon"><i class="fas fa-file-excel"></i></div>
      <p>Excel Report</p>
    </div>

    <div class="card">
      <div class="icon"><i class="fas fa-layer-group"></i></div>
      <p>Combined Reports</p>
    </div>

    <div class="card">
      <div class="icon"><i class="fas fa-code"></i></div>
      <p>HTML Reports</p>
    </div>

  </div>
</section>

</main>
</div>

<script>

// Ripple Effect
document.querySelectorAll(".card").forEach(card => {
  card.addEventListener("click", function(e) {
    let ripple = document.createElement("span");
    ripple.style.left = e.offsetX + "px";
    ripple.style.top = e.offsetY + "px";
    this.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
  });
});

</script>


{% endblock %}
