<!DOCTYPE html>
    <html lang="en">
<head>
<meta charset="UTF-8">
<title>Upload - Jasper Automation</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>

/* ===== SAME CSS (UNCHANGED) ===== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  background: #f3f4f6;
}

.app {
  display: flex;
}

.sidebar {
  width: 240px;
  height: 100vh;
  background: white;
  padding: 20px;
  position: fixed;
  left: 0;
  top: 0;
  box-shadow: 2px 0 10px rgba(0,0,0,0.05);
}

.logo {
  color: #6d28d9;
  margin-bottom: 20px;
}

.sidebar nav a {
  display: block;
  padding: 10px;
  margin: 6px 0;
  border-radius: 10px;
  text-decoration: none;
  color: #334155;
  transition: 0.3s;
}

.sidebar nav a:hover,
.sidebar nav a.active {
  background: #6d28d9;
  color: white;
  transform: translateX(5px);
}

.bottom {
  position: absolute;
  bottom: 20px;
  width: 80%;
}

.main {
  margin-left: 260px;
  width: 100%;
  padding: 20px;
}

/* HEADER FIX */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: white;
  padding: 10px;
  border-radius: 12px;
  margin-bottom: 20px;
}



.avatar {
  padding: 8px 20px;
  background: #1f86dc;
  color: white;
  border-radius: 20px;
  font-weight: bold;
  justify-content: center;
  display: flex;
  align-items: center;
}

/* ===== UPLOAD SECTION (NEW) ===== */

.upload-section {
  background: white;
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.05);
}



/* DROP AREA */
.file-input-label {
  display: block;
  padding: 50px;
  border: 2px dashed #cbd5e1;
  border-radius: 16px;
  text-align: center;
  cursor: pointer;
  transition: 0.3s;
}

.file-input-label:hover {
  border-color: #6d28d9;
  background: #f5f3ff;
}

.file-input-label.drag-over {
  border-color: #22c55e;
  background: #ecfdf5;
}

.upload-icon {
  font-size: 45px;
  margin-bottom: 10px;
  color: #6d28d9;
}

/* BUTTON */
#uploadButton {
  margin-top: 20px;
  background: #6d28d9;
  color: white;
  padding: 10px 25px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  transition: 0.3s;
}

#uploadButton:hover {
  background: #9333ea;
}

/* FILE GRID */
.files-container {
  margin-top: 30px;
}

.files-grid {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}

.file-card {
  background: white;
  padding: 15px;
  border-radius: 12px;
  width: 200px;
  text-align: center;
  box-shadow: 0 5px 15px rgba(0,0,0,0.05);
  transition: 0.3s;
}

.file-card:hover {
  transform: translateY(-5px);
}

</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->
<aside class="sidebar">
  <h2 class="logo">Jasper Automation</h2>

  <nav>
    <a href="D:\hulesh\HTML\home.html">🏠 Dashboard</a>
    <a href="D:\hulesh\HTML\api_setting.html">🔑 API Settings</a>
    <a href="upload.html" class="active">📤 Upload</a>
    <a href="D:\hulesh\HTML\main.html">📊 Reports</a>
  </nav>

  <div class="bottom">
    <!-- <a>👤 Profile</a>
    <a style="color:red;">🚪 Logout</a> -->
  </div>
</aside>

<!-- MAIN -->
<main class="main">

<header class="header">
  <h2>Upload Files</h2>
  <div class="avatar">REPORT TEAM</div>
</header>

<section class="upload-section" >

  <input type="file" id="fileInput" multiple hidden>

  <label for="fileInput" class="file-input-label" id="dropArea">
    <div class="upload-icon">☁️</div>
    <p>Drag & Drop files or Click to Upload</p>
  </label>

  <button id="uploadButton">Upload Files</button>

</section>

<!-- FILE LIST -->
<div class="files-container" >
  <h3 class="section-title">Uploaded Files</h3>
  <div class="files-grid" id="filesGrid"></div>
</div>

</main>
</div>

<script>

let files = [];

// SELECT
fileInput.addEventListener("change", e => {
  files = [...files, ...e.target.files];
  renderFiles();
});

// DRAG
const dropArea = document.getElementById("dropArea");

dropArea.addEventListener("dragover", e => {
  e.preventDefault();
  dropArea.classList.add("drag-over");
});

dropArea.addEventListener("dragleave", () => {
  dropArea.classList.remove("drag-over");
});

dropArea.addEventListener("drop", e => {
  e.preventDefault();
  dropArea.classList.remove("drag-over");

  files = [...files, ...e.dataTransfer.files];
  renderFiles();
});

// RENDER
function renderFiles() {
  const grid = document.getElementById("filesGrid");
  grid.innerHTML = "";

  files.forEach(file => {
    grid.innerHTML += `
      <div class="file-card">
        <p>📄 ${file.name}</p>
        <small>${(file.size/1024).toFixed(1)} KB</small>
      </div>
    `;
  });
}

// UPLOAD
uploadButton.onclick = () => {
  if(files.length === 0){
    alert("No files selected");
    return;
  }

  alert("Uploading " + files.length + " files...");
};

</script>

</body>
</html>
