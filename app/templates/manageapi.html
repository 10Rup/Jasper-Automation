{% extends "base.html" %}
{% block content %}


{% block styles %}
<style>


.bottom {
  position: absolute;
  bottom: 20px;
}

.main {
  margin-left: 260px;
  padding: 20px;
}

/* ===== API FORM ===== */

.api-container {
  background: white;
  padding: 30px;
  margin-top: 20px;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.05);
  max-width: 500px;
}

/* INPUT GROUP */
.form-group {
  margin-bottom: 20px;
}

label {
  font-weight: 600;
  display: block;
  margin-bottom: 6px;
}

input, select {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ddd;
  transition: 0.3s;
}

input:focus, select:focus {
  border-color: #6d28d9;
  outline: none;
  box-shadow: 0 0 5px rgba(109,40,217,0.3);
}

/* BUTTONS */
.btn-group {
  display: flex;
  gap: 10px;
}

.btn {
  padding: 10px 20px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  transition: 0.3s;
}

/* PRIMARY */
.btn-primary {
  background: #6d28d9;
  color: white;
}

.btn-primary:hover {
  background: #9333ea;
}

/* SECONDARY */
.btn-secondary {
  background: #f97316;
  color: white;
}

.btn-secondary:hover {
  background: #fb923c;
}

/* STATUS */
.status {
  margin-top: 10px;
  font-weight: 600;
}

.success {
  color: green;
}

.error {
  color: red;
}

</style>
{% endblock %}
</head>

<body>


<!-- MAIN -->
<main class="main">

    <header class="header">
        <h2>Manage API Keys</h2>
      <div class="header-right">
        <div class="avatar">REPORT TEAM</div>
      </div>
    </header>


<section class="api-container">
<form action="/api/add-key" method="post" id="apiForm">
  <div class="form-group">
    <label>User Name</label>
    <input type="text" id="username" name="username" placeholder="Enter User Name" required>
  </div>

  <div class="form-group">
    <label>Select API</label>
    <select id="apiname" name="apiname" required>
      <option value="geminie">API Gemini</option>
      <option value="openapi">OpenAI</option>
      <option value="ollama">Ollama</option>
      <option value="other">Custom API</option>
    </select>
  </div>

  <div class="form-group">
    <label>API Key</label>
    <input type="password" id="apikey" name="apikey"  placeholder="Enter API Key">
  </div>

  <div class="btn-group">
    <button class="btn btn-primary" type ="submit">Save</button>
  </div>

  <div id="status" class="status"></div>
</form>
</section>

</main>
{% endblock %}
