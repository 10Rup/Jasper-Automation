      * {
            user-select: none;

        body {
            background: #f3f4f6;

        /* HEADER */
            .header {
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            flex-direction: column; /* IMPORTANT */

            background: white;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 10px;

            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            }

            /* TOP ROW */
            .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            }

            .header-right {
            display: flex;
            justify-content: flex-end;
            }
            .form-group {
            margin-bottom: 20px;
            }

            label {
            font-weight: 600;
            display: block;
            }

            /* CARD */
            .crop-container {
            background: white;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            }

            /* IMAGE */
            .preview-img {
            width: 300px;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            }

            .preview-img:hover {
            transform: scale(1.03);
            }

             /* select API  */
            label {
            font-weight: 600;
            display: block;
            margin-left: 10px;
            }

            input, select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
            transition: 0.3s;
            }

            input:focus, select:focus {
            border-color: #6d28d9;
            outline: none;
            box-shadow: 0 0 5px rgba(109,40,217,0.3);
            }

        .crop-container { margin-bottom: 30px; border-bottom: 2px solid #eee; padding-bottom: 20px; }
        .controls { margin: 15px 0; display: flex; gap: 10px; align-items: center; }
        .btn { padding: 8px 15px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; font-weight: bold; }
        .btn-delete { background-color: #ffcccc; color: #a00; border-color: #faa; }
        .btn-process { background-color: #28a745; color: white; border-color: #218838; }
        .refine-input { flex-grow: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        .result-box { width: 100%; height: 250px; font-family: 'Courier New', monospace; margin-top: 10px; display: none; background: #2d2d2d; color: #f8f8f2; padding: 12px; border-radius: 4px; font-size: 13px; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="header-left">
                <h2>Report Files</h2>
                <h4>{{ report.displayname }}</h4>
            </div>  
            <!-- API DROPDOWN -->
            <div class="header-right">
                <div class="form-group">
                    <label>Select API</label>
                    <select id="apiname" name="apiname" required>
                    <option value="geminie">API Gemini</option>
                    <option value="openapi">OpenAI</option>
                    <option value="other">Custom API</option>
                    </select>
                </div>
            </div>
    </div>

    <div>
        {% for crop in crops %}
            <div class="crop-container" id="container_{{crop.id}}">
                <b>
                    <span>(Target Band: <span style="color:blue;">{{crop.bandname}}</span>)
                </b>
                <br>
                <img src="/cropimages/{{crop.filepath}}" onclick="openPreview('/cropimages/{{crop.filepath}}')" width="300" height="200" style="border: 1px solid #999; margin-top:10px;">                    
                <div class="controls">
                    <input type="text" id="prompt_{{crop.id}}" class="refine-input" placeholder="Optional: Add extra instructions (e.g., 'make text bold', '3 columns')...">
                    
                    <button class="btn btn-process" id="btn_{{crop.id}}" onclick="apiProcess('{{crop.id}}', '{{crop.uploadfile_id}}-{{filename}}', '{{crop.bandname}}','{{crop.filepath}}')">
                        Prepare Design
                    </button>
                    
                    <button class="btn btn-delete" onclick="deleteImage('{{crop.id}}')">Delete</button>
                </div>
         
                <textarea class="result-box" id="result_{{crop.id}}" readonly></textarea>
            </div>
        {% endfor %}
    </div>

    <!-- MODAL -->
        <div class="modal fade" id="previewModal" tabindex="1" >
            <div class="modal-dialog modal-lg modal-dialog-centered" >
                <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Report Preview</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body text-center">
                    <img id="previewImage" style="width:100%; border-radius:10px;">
                </div>

                </div>
            </div>
        </div>

    <script>
        /* IMAGE PREVIEW */
        function openPreview(img){
            console.log("Image:", img); // debug

            const preview = document.getElementById("previewImage");
            preview.src = img;

            const modal = new bootstrap.Modal(document.getElementById("previewModal"));
            modal.show();
        }
    </script>
