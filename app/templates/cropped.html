<!DOCTYPE html>
<html>
<head>
    <title>Report Files</title>    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
      * {
            user-select: none;
        }

        body {
            background: #f3f4f6;
        }

        /* HEADER */
            .header {
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            flex-direction: column; /* IMPORTANT */

            background: white;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 10px;

            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            }

            /* TOP ROW */
            .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            }

            .header-right {
            display: flex;
            justify-content: flex-end;
            }
            .form-group {
            margin-bottom: 20px;
            }

            label {
            font-weight: 600;
            display: block;
            }

            /* CARD */
            .crop-container {
            background: white;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            }

            /* IMAGE */
            .preview-img {
            width: 300px;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            }

            .preview-img:hover {
            transform: scale(1.03);
            }

             /* select API  */
            label {
            font-weight: 600;
            display: block;
            margin-left: 10px;
            }

            input, select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
            transition: 0.3s;
            }

            input:focus, select:focus {
            border-color: #6d28d9;
            outline: none;
            box-shadow: 0 0 5px rgba(109,40,217,0.3);
            }


            /* xml code section */
            .xml-box-container {
                position: relative;
                margin-top: 10px;
                margin-right: 20px;
            }

            .xml-actions {
                position: absolute;
                top: 8px;
                right: 10px;
                z-index: 10;
                display: flex;
                gap: 10px;
            }

            .xml-actions i {
                cursor: pointer;
                color: #ccc;
                font-size: 16px;
                transition: 0.2s;
            }

            .xml-actions i:hover {
                color: #fff;
            } 
            

            /* textarea padding so text doesn't overlap icons */
            .result-box {
                padding-top: 30px;
            }

            .crop-container { margin-bottom: 30px; border-bottom: 2px solid #eee; padding-bottom: 20px; }
            .controls { margin: 15px 0; display: flex; gap: 10px; align-items: center; }
            .btn { padding: 8px 15px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; font-weight: bold; }
            .btn-delete { background-color: #ffcccc; color: #a00; border-color: #faa; }
            .btn-process { background-color: #28a745; color: white; border-color: #218838; }
            .refine-input { flex-grow: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
            .result-box { width: 100%; height: 250px; font-family: 'Courier New', monospace; margin-top: 10px; display: none; background: #2d2d2d; color: #f8f8f2; padding: 12px; border-radius: 4px; font-size: 13px; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="header-left">
                <h2>Report Files</h2>
                <h4>{{ report.displayname }}</h4>
            </div>  
            <!-- API DROPDOWN -->
            <div class="header-right">
                <div class="form-group">
                    <label>Select API</label>
                    <select id="apiname" name="apiname" required>
                    <option value="geminie">API Gemini</option>
                    <option value="openapi">OpenAI</option>
                    <option value="other">Custom API</option>
                    </select>
                </div>
            </div>
    </div>

    <div>
        {% for crop in crops %}
            <div class="crop-container" id="container_{{crop.id}}">
                <b>
                    <span>(Target Band: <span style="color:blue;">{{crop.bandname}}</span>)
                </b>
                <br>
                <img src="/cropimages/{{crop.filepath}}" onclick="openPreview('/cropimages/{{crop.filepath}}')" width="300" height="200" style="border: 1px solid #999; margin-top:10px;">                    
                <div class="controls">
                    <input type="text" id="prompt_{{crop.id}}" class="refine-input" placeholder="Optional: Add extra instructions (e.g., 'make text bold', '3 columns')...">
                    
                    <button class="btn btn-process" id="btn_{{crop.id}}" onclick="apiProcess('{{crop.id}}', '{{report.displayname}}', '{{crop.bandname}}','{{crop.filepath}}')">
                        Prepare Design
                    </button>
                    
                    <button class="btn btn-delete" onclick="deleteImage('{{crop.id}}')">Delete</button>
                </div>
         
                <div class="xml-box-container">
    
                    <div class="xml-actions">
                        <i class="fas fa-copy" onclick="copyXML('{{crop.id}}')" title="Copy"></i>
                        <i class="fas fa-save" onclick="saveXML('{{crop.id}}','{{crop.bandname}}')" title="Save"></i>
                    </div>

                    <textarea class="result-box" id="result_{{crop.id}}" readonly></textarea>

                </div>
            </div>
        {% endfor %}
    </div>

    <!-- MODAL -->
        <div class="modal fade" id="previewModal" tabindex="1" >
            <div class="modal-dialog modal-lg modal-dialog-centered" >
                <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Report Preview</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body text-center">
                    <img id="previewImage" style="width:100%; border-radius:10px;">
                </div>

                </div>
            </div>
        </div>

    <!-- <script  src="https://cdn.jsdeliv"-->        
     <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous">
    </script>
    
    <script>
        let previewModal = null;

        document.addEventListener("DOMContentLoaded", () => {
            previewModal = new bootstrap.Modal(document.getElementById("previewModal"));
        });

        function openPreview(img){
            const preview = document.getElementById("previewImage");
            preview.src = img;
            previewModal.show();
        }
    </script>

    <script>
        function deleteImage(filename) {
            if (!confirm("Are you sure?")) return;
            // fetch(`/delete-region/${fileId}/${filename}`, { method: "DELETE" })
            // .then(res => res.json())
            // .then(() => {
            //     alert("Deleted!");
            //     location.reload();
            // });
            alert("Deleted");

        }

        function apiProcess(fileId, filename, band, file_path) {
            const resultBox = document.getElementById("result_" + fileId);
            const processBtn = document.getElementById("btn_" + fileId);
            const extraPrompt = document.getElementById("prompt_" + fileId).value;
            const api_name = document.getElementById('apiname').value;

           
             // UI Feedback
            resultBox.style.display = "block";
            resultBox.value = "Analyzing image and generating JRXML... please wait.";
            resultBox.style.background = "#fff";
            resultBox.style.color = "#333";
            processBtn.disabled = true;
            processBtn.innerText = "Processing...";

            // Encode the extra prompt to handle special characters in URL
            // const queryParams = extraPrompt ? `?extra=${encodeURIComponent(extraPrompt)}` : "";

            fetch('/prepare/image-to-xml',{
                method: "POST",
                header: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    crop_id : fileId,
                    reportname : filename,
                    bandname : band,
                    reportpath : file_path,
                    apiname : api_name,
                    extrapromt : extraPrompt
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "error") {
                    resultBox.value = "AI Error: " + data.message;
                    resultBox.style.color = "red";
                } else {
                    resultBox.value = data.xml;
                    resultBox.style.background = "#2d2d2d";
                    resultBox.style.color = "#f8f8f2";
                }
            })
            .catch(err => {
                resultBox.value = "Network failed: " + err;
                resultBox.style.color = "red";
            })
            .finally(() => {
                processBtn.disabled = false;
                processBtn.innerText = "Process to XML";
            });

        }


        function copyXML(id) {
            const text = document.getElementById("result_" + id).value;

            navigator.clipboard.writeText(text)
                // .then(() => alert("Copied!"))
                // .catch(() => alert("Copy failed"));
        }

        function saveXML(id, band) {
            const xml = document.getElementById("result_" + id).value;

            fetch("/prepare/save-xml", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    crop_id: id,
                    band: band,
                    xml: xml
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status == "success"){
                    alert(data.message)
                }
                    
            })
            .catch(() => alert("Save failed"));
        }
    </script>
    
</body>


</html>
