<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jasper Automation - Report Files</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f3f4f6;
            font-family: "Segoe UI", sans-serif;
            user-select: none;
        }

        /* HEADER */
        .header {
            position: sticky;
            top: 0;
            background: white;
            padding: 15px 25px;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left h2 { margin: 0; color: #333; }
        .header-left h4 { margin: 5px 0 0 0; color: #666; font-size: 1rem; }

        /* API DROPDOWN */
        .api-select-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .api-select-group select {
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        /* CARD */
        .crop-container {
            background: white;
            padding: 25px;
            border-radius: 16px;
            margin: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        /* LAYOUT */
        .row-layout {
            display: flex;
            gap: 25px;
            align-items: flex-start;
        }

        /* LEFT SIDE */
        .left-col {
            width: 320px;
            flex-shrink: 0;
        }

        .preview-img {
            width: 100%;
            height: 200px;
            object-fit: contain;
            border-radius: 10px;
            cursor: pointer;
            border: 1px solid #eee;
            transition: transform 0.2s;
        }
        .preview-img:hover { transform: scale(1.02); }

        .btn-group-custom {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        .btn-group-custom .btn { flex: 1; font-weight: 600; }

        /* RIGHT SIDE */
        .right-col {
            flex: 1;
        }

        .prompt-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            transition: 0.3s;
        }
        .prompt-input:focus {
            border-color: #6d28d9;
            outline: none;
            box-shadow: 0 0 5px rgba(109,40,217,0.2);
        }

        /* XML BOX */
        .xml-box-container {
            position: relative;
        }

        .xml-actions {
            position: absolute;
            margin-right: 30px;
            top: 10px;
            right: 15px;
            display: flex;
            gap: 12px;
            z-index: 5;
        }

        .xml-actions i {
            color: #888;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.2s;
        }

        .xml-actions i:hover { color: #6d28d9; }

        .result-box {
            width: 100%;
            height: 250px;
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 40px 15px 15px 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
            display: none; /* Hidden until process starts */
            resize: vertical;
        }

        /* MODAL VIEWER */
        .viewer-container {
            height: 75vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #f8f9fa;
            cursor: grab;
        }

        #previewImageLarge {
            max-width: 100%;
            transition: transform 0.1s ease-out;
        }

        .viewer-tools {
            position: absolute;
            top: 15px;
            right: 60px; /* Leave space for close button */
            z-index: 10;
        }

        .viewer-tools button {
            background: #6d28d9;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            margin-left: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
    </style>
</head>

<body>

<div class="header">
    <div class="header-left">
        <h2>Report Files</h2>
        <h4>{{ report.displayname }}</h4>
    </div>
    
    <div class="api-select-group">
        <label for="apiname"><b>Select API:</b></label>
        <select id="apiname">
            <option value="geminie">API Gemini</option>
            <option value="openapi">OpenAI</option>
            <option value="other">Custom API</option>
        </select>
    </div>
</div>

<div id="crops-list">
    {% for crop in crops %}
    <div class="crop-container" id="container_{{crop.id}}">
        <p><b>(Target Band: <span style="color:blue;">{{crop.bandname}}</span>)</b></p>

        <div class="row-layout">
            <div class="left-col">
                <img src="/cropimages/{{crop.filepath}}" 
                     class="preview-img" 
                     onclick="openPreview('/cropimages/{{crop.filepath}}')"
                     alt="Crop Preview">

                <div class="btn-group-custom">
                    <button class="btn btn-success" id="btn_{{crop.id}}" 
                            onclick="apiProcess('{{crop.id}}', '{{report.displayname}}', '{{crop.bandname}}','{{crop.filepath}}')">
                        Prepare Design
                    </button>
                    <button class="btn btn-outline-danger" onclick="deleteImage('{{crop.id}}')">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>

            <div class="right-col">
                <input type="text" id="prompt_{{crop.id}}" class="prompt-input" 
                       placeholder="Optional: Add extra instructions (e.g. '3 columns', 'bold text')...">

                       <div class="xml-box-container">
                        <div class="xml-actions" id="actions_{{crop.id}}" style="display: none;">
                            <i class="fas fa-copy" onclick="copyXML('{{crop.id}}')" title="Copy XML"></i>
                            <i class="fas fa-save" onclick="saveXML('{{crop.id}}','{{crop.bandname}}')" title="Save to File"></i>
                        </div>
                    
                        <textarea id="result_{{crop.id}}" class="result-box" readonly></textarea>
                    </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

<div class="modal fade" id="previewModal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Image Preview</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="viewer-tools">
                <button onclick="zoomIn()"><i class="fas fa-search-plus"></i></button>
                <button onclick="zoomOut()"><i class="fas fa-search-minus"></i></button>
                <button onclick="resetZoom()">Reset</button>
            </div>

            <div class="modal-body p-0">
                <div class="viewer-container" id="viewer">
                    <img id="previewImageLarge" src="" alt="Full Preview">
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    /* --- API LOGIC --- */

    function apiProcess(fileId, filename, band, file_path) {
    const resultBox = document.getElementById("result_" + fileId);
    const actionIcons = document.getElementById("actions_" + fileId); // Get the icon container
    const processBtn = document.getElementById("btn_" + fileId);
    const extraPrompt = document.getElementById("prompt_" + fileId).value;
    const api_name = document.getElementById('apiname').value;

    // 1. Show the Textarea AND the Icon Buttons
    resultBox.style.display = "block";
    actionIcons.style.display = "flex"; // Show icons (using flex to maintain layout)

    // UI Feedback
    resultBox.value = "Analyzing image and generating XML... please wait.";
    resultBox.style.background = "#fff";
    resultBox.style.color = "#333";
    
    processBtn.disabled = true;
    processBtn.innerText = "Processing...";

    fetch('/prepare/image-to-xml', {
        method: "POST",
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            crop_id: fileId,
            reportname: filename,
            bandname: band,
            reportpath: file_path,
            apiname: api_name,
            extrapromt: extraPrompt
        })
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === "error") {
            resultBox.value = "AI Error: " + data.message;
            resultBox.style.color = "red";
            // Optional: Hide icons again if there is a critical error
            // actionIcons.style.display = "none"; 
        } else {
            resultBox.value = data.xml;
            resultBox.style.background = "#2d2d2d";
            resultBox.style.color = "#f8f8f2";
        }
    })
    .catch(err => {
        resultBox.value = "Network failed: " + err;
        resultBox.style.color = "red";
    })
    .finally(() => {
        processBtn.disabled = false;
        processBtn.innerText = "Prepare Design";
    });
}
    function copyXML(id) {
        const text = document.getElementById("result_" + id).value;
        if(!text) return;
        navigator.clipboard.writeText(text).then(() => {
            alert("XML copied to clipboard!");
        });
    }

    function saveXML(id, band) {
        const xml = document.getElementById("result_" + id).value;
        if(!xml || xml.startsWith("Analyzing")) return;

        fetch("/prepare/save-xml", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ crop_id: id, band: band, xml: xml })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status == "success") alert(data.message);
        })
        .catch(() => alert("Save failed"));
    }

    function deleteImage(id) {
        if (confirm("Are you sure you want to delete this crop?")) {
            // Your delete logic here
            document.getElementById("container_" + id).remove();
            alert("Deleted from view (Backend call needs implementation)");
        }
    }

    /* --- ADVANCED VIEWER LOGIC --- */
    let scale = 1, posX = 0, posY = 0, dragging = false, startX, startY;
    const imgLarge = document.getElementById("previewImageLarge");
    const viewer = document.getElementById("viewer");
    let bModal = null;

    function openPreview(src) {
        imgLarge.src = src;
        resetZoom();
        if(!bModal) bModal = new bootstrap.Modal(document.getElementById("previewModal"));
        bModal.show();
    }

    function zoomIn() { scale += 0.2; applyTransform(); }
    function zoomOut() { scale = Math.max(0.5, scale - 0.2); applyTransform(); }
    function resetZoom() { scale = 1; posX = 0; posY = 0; applyTransform(); }

    function applyTransform() {
        imgLarge.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
    }

    // Drag Logic
    viewer.addEventListener("mousedown", e => {
        dragging = true;
        viewer.style.cursor = "grabbing";
        startX = e.clientX - posX;
        startY = e.clientY - posY;
    });

    window.addEventListener("mousemove", e => {
        if (!dragging) return;
        posX = e.clientX - startX;
        posY = e.clientY - startY;
        applyTransform();
    });

    window.addEventListener("mouseup", () => {
        dragging = false;
        viewer.style.cursor = "grab";
    });

    viewer.addEventListener("wheel", e => {
        e.preventDefault();
        e.deltaY < 0 ? zoomIn() : zoomOut();
    }, { passive: false });
</script>

</body>
</html>
