<!DOCTYPE html>
<html>

<head>

    <title>Dashboard View</title>

    <!-- GridStack -->
    <link
        href="https://cdn.jsdelivr.net/npm/gridstack@10.1.1/dist/gridstack.min.css"
        rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/gridstack@10.1.1/dist/gridstack-all.js"></script>

    <!-- Plotly -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

    <style>

        body{
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
            font-family: Arial;
        }

        .grid-stack{
            min-height: 100vh;
        }

        .grid-stack-item-content{
            background: white;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #ddd;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .graph{
            width: 100%;
            height: 100%;
        }

    </style>

</head>

<body>

<h1>Dashboard</h1>

<div class="grid-stack"></div>

<script>

    // Data from FastAPI
    let widgets = {{ widgets | tojson }};

    // Create static grid
    let grid = GridStack.init({

        staticGrid: true,

        float: true,

        cellHeight: 80,

        margin: 10

    });




    widgets.forEach(widget => {

        let item = document.createElement('div');

        item.innerHTML = `
            <div class="grid-stack-item-content">

                <div
                    id="graph-${widget.id}"
                    class="graph"
                ></div>

            </div>
        `;


        // Add widget position
        grid.addWidget(item, {

            x: widget.x,
            y: widget.y,
            w: widget.w,
            h: widget.h

        });




        // Render Plotly graph
        renderGraph(widget);

    });





    function renderGraph(widget){

        let graphDiv = `graph-${widget.id}`;

        let config = widget.content;

        Plotly.newPlot(

            graphDiv,

            config.data,

            config.layout || {},

            {
                responsive: true
            }

        );

    }

</script>

</body>
</html>
