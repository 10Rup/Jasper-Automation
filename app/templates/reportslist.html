{% extends "base.html" %}
{% block content %}

{% block styles %}
  <style>
    .main { margin-left: 260px; padding: 20px; }
    .report-table-container { background: white; padding: 20px; border-radius: 16px; margin-top: 20px; }
    .report-table { width: 100%; border-collapse: collapse; overflow: hidden; border-radius: 10px; }
    .report-table thead { background: linear-gradient(135deg,#6d28d9,#9333ea); color: white; }
    .report-table th, .report-table td { padding: 14px; text-align: center; }
    .report-name { cursor:pointer; color: #6d28d9; font-weight: bold; }
    
    /* BUTTONS */
    .btn-process, .btn-prepare { background: #22c55e; color: white; border: none; padding: 6px 12px; border-radius: 6px; }
    .btn-delete { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; }
    
    /* MODAL TEXTAREA */
    .query-textarea {
        width: 100%;
        height: 100%;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 10px;
        font-family: monospace;
        resize: none;
    }
  </style>
{% endblock %}

<main class="main">
  <header class="header">
      <h2 class="header"> {{ report_ext|capitalize }} Reports</h2>
    <div class="header-right">
      <div class="avatar">REPORT TEAM</div>
    </div>
  </header>

  <div class="report-table-container">
    <table class="report-table">
      <thead>
        <tr>
          <th>Report Name</th>
          <th>Query</th>
          <th>Process</th>
          <th>Delete</th>
          <th>Prepare</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        {% for file in files %}
            <tr>
                <td class="report-name" onclick="preview('/images/{{file.filepath}}')">{{file.displayname}}</td>
                <td>
                    <button class="btn-process" onclick="openQueryModal('{{file.id}}')">Add Query</button>
                </td>
                <td><button class="btn-process" onclick="process('{{file.id}}')">Process</button></td>
                <td><button class="btn-delete" onclick="removeRow('{{file.id}}')">Delete</button></td>
                <td><button class="btn-prepare" onclick="prepare('{{file.id}}')">Prepare Report</button></td>
            </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</main>

<div class="modal fade" id="queryModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add Query</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" style="height: 300px;">
          <input type="hidden" id="currentFileId">
          <textarea id="queryText" class="query-textarea" placeholder="Enter your query here..."></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" onclick="saveQuery()">Save Query</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="previewModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Report Preview</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center">
                <img id="previewImage" style="width:100%; border-radius:10px;">
            </div>
        </div>
    </div>
</div>

<script>
    // OPEN MODAL AND SET ID
    function openQueryModal(fileId) {
        document.getElementById("currentFileId").value = fileId;
        document.getElementById("queryText").value = ""; // Clear previous text
        new bootstrap.Modal(document.getElementById("queryModal")).show();
    }

    // SAVE LOGIC
    function saveQuery() {
        const fileId = document.getElementById("currentFileId").value;
        const queryValue = document.getElementById("queryText").value;

        if (!queryValue.trim()) {
            alert("Please enter a query before saving.");
            return;
        }

        fetch('/reports/save-query', {
            method: "POST",
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                id: fileId,
                query: queryValue
            })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                alert(data.message);
                bootstrap.Modal.getInstance(document.getElementById("queryModal")).hide();
                location.reload();

                fetch(`/reports/process-query/${fileId}`,{
                    method: "POST",
                    headers: { 'Content-Type': 'application/json' },
                    
                })
                .then(res => res.json())
                .then(data => {
                    console.log(data)
                })


            } else {
                alert("Error: " + data.message);
            }
        })
        .catch(err => console.error("Save failed:", err));
    }

    // Existing Functions
    function preview(img) {
        document.getElementById("previewImage").src = img;
        new bootstrap.Modal(document.getElementById("previewModal")).show();
    }

    function process(fileId) { window.location.href = `/process/${fileId}`; }
    function prepare(fileId) { window.location.href = `/process/${fileId}/cropped`; }

    function removeRow(i) {
        if(confirm("Are you sure you want to delete this?")) {
            fetch(`/reports/delete/${i}`, { method: "DELETE" })
            .then(res => res.json())
            .then(data => {
                if (data.status == 'success') {
                    location.reload();
                }
            });
        }
    }
</script>

{% endblock %}
