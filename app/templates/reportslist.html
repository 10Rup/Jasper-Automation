{% extends "base.html" %}
{% block content %}


{% block styles %}
  <style>
    .main {
        margin-left: 260px;
        padding: 20px;
    }
        /* TABLE */
        .report-table-container {
        background: white;
        padding: 20px;
        border-radius: 16px;
        margin-top: 20px ;
        }

        .report-table {
        width: 100%;
        border-collapse: collapse;
        overflow: hidden;
        border-radius: 10px;
        }

        .report-table thead {
        background: linear-gradient(135deg,#6d28d9,#9333ea);
        color: white;
        }

        .report-table th, .report-table td {
        padding: 14px;
        }

        .report-name {
        cursor:pointer;
        color: #6d28d9;
        font-weight: bold;
        /* text-decoration: none; */
        }

        .report-name:hover {
        text-decoration: none;
        }

        /* BUTTONS */
        .btn-process {
        background: #22c55e;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 6px;
        }

        .btn-delete {
        background: #ef4444;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 6px;
        }

  </style>

{% endblock %}

<!-- MAIN -->


<main class="main">

    <header class="header">
        <h2 class="header" >New Reports</h2>
      <div class="header-right">
        <div class="avatar">REPORT TEAM</div>
      </div>
    </header>
<div class="report-table-container">

<table class="report-table">
  <thead>
    <tr>
      <th>Report Name</th>
      <th>Process</th>
      <th>Delete</th>
    </tr>
  </thead>

  <tbody id="tableBody">
    {% for file in files %}
        <tr>
            <td class="report-name" onclick="preview('{{file.filepath}}')">
                {{file.displayname}}
            </td>

            <td>
                <button class="btn-process" onclick="process('{{file.id}}')">
                Process
                </button>
            </td>

            <td>
                <button class="btn-delete" onclick="removeRow('{{file.id}}')">
                Delete
                </button>
            </td>
        
        </tr>

    {%endfor%}
  </tbody>
</table>

</div>

</main>
</div>
<!-- MODAL -->
<div class="modal fade" id="previewModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Report Preview</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body text-center">
        <img id="previewImage" style="width:100%; border-radius:10px;">
      </div>

    </div>
  </div>
</div>
<script>


        const table = document.getElementById("tableBody");

        

        /* PREVIEW */
        function preview(img){
        document.getElementById("previewImage").src = img;
        new bootstrap.Modal(document.getElementById("previewModal")).show();
        }

        /* PROCESS */
        // function process(i){
        // alert("Processing ");
        // }
        function process(fileId){
        window.location.href = `/process/${fileId}`;
      }

        /* DELETE */
        function removeRow(i){
        alert("Deleted " + reports[i].name);
        }

        </script>


{% endblock %}
