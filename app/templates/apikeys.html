<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>API Keys - Jasper Automation</title>

<style>

/* ===== RESET ===== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  background: #f3f4f6;
}

/* ===== LAYOUT ===== */
.main {
  margin-left: 260px;
  padding: 20px;
}

/* ===== CONTAINER ===== */
.table-container {
  background: #e5e7eb;
  padding: 20px;
  border-radius: 16px;
}

/* ===== TITLE ===== */
.title {
  font-weight: bold;
  margin-bottom: 10px;
}

/* ===== TABLE ===== */
.api-table {
  width: 100%;
  border-collapse: collapse;
  overflow: hidden;
  border-radius: 10px;
}

/* HEADER */
.api-table thead {
  background: linear-gradient(135deg,#6d28d9,#9333ea);
  color: white;
}

.api-table th {
  padding: 14px;
  text-align: left;
  font-weight: 600;
}

/* BODY */
.api-table td {
  padding: 14px;
  background: white;
  border-bottom: 1px solid #eee;
}

/* HOVER */
.api-table tbody tr:hover {
  background: #f5f3ff;
  transition: 0.3s;
}

/* EMPTY STATE */
.empty {
  text-align: center;
  padding: 20px;
  color: gray;
}

</style>
</head>

<body>

<div class="main">

<div class="table-container">

  <div class="title">Saved API Keys</div>

  <table class="api-table">
    <thead>
      <tr>
        <th>Username</th>
        <th>API Type</th>
        <th>API Key</th>
      </tr>
    </thead>

    <tbody id="tableBody">
      {% for key in apikeys%}
      <tr>
        <td  >{{key.username}}</td>
        <td >{{key.apiname}}</td>
        <td >{{key.apikey}}</td>

      </tr>
      {% endfor%}
    </tbody>
  </table>

</div>

</div>

<script>

</script>

</body>
</html>
