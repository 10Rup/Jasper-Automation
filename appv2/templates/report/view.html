<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Report Studio - View Reports</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{
background:linear-gradient(135deg,#0f172a,#1e1b4b,#312e81);
color:#fff;min-height:100vh;padding:30px}
.container{max-width:1500px;margin:auto}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
.logo{font-size:2rem;font-weight:700}
.badge{padding:10px 18px;background:#7c3aed;border-radius:50px}
.card{
background:rgba(255,255,255,.08);
backdrop-filter:blur(16px);
border:1px solid rgba(255,255,255,.15);
border-radius:22px;
padding:25px;
margin-bottom:40px;
box-shadow:0 15px 40px rgba(0,0,0,.35)}
.title{font-size:1.3rem;margin-bottom:18px}
.report-preview{
width:100%;
background:#fff;
border-radius:18px;
overflow:auto;
padding:10px;
max-height:900px}
.report-image{
display:block;
width:100%;
height:auto;
border-radius:10px}
textarea{
width:100%;
height:140px;
margin:20px 0;
background:rgba(255,255,255,.08);
border:none;
border-radius:15px;
padding:15px;
color:#fff;
resize:vertical}
textarea::placeholder{color:#cbd5e1}
.actions{
display:flex;
gap:15px;
flex-wrap:wrap}
.btn{
flex:1;
min-width:180px;
text-align:center;
text-decoration:none;
padding:14px;
border:none;
border-radius:14px;
font-weight:600;
color:#fff;
cursor:pointer;
transition:.25s}
.btn:hover{transform:translateY(-3px)}
.process{background:#2563eb}
.query{background:#7c3aed}
.generate{background:#16a34a}
.toast{
position:fixed;
top:20px;
right:20px;
padding:15px 20px;
border-radius:12px;
display:none;
color:#fff;
font-weight:600}
@media(max-width:900px){
.actions{flex-direction:column}
.btn{width:100%}
}
</style>
</head>
<body>

<div class="container">

<div class="header">
<div>
<div class="logo"><i class="fa-solid fa-file-waveform"></i> AI Report Studio</div>
<div style="opacity:.7">View • Process • Generate Reports</div>
</div>
<div class="badge">REPORTS</div>
</div>

{% if reports %}

{% for report in reports %}

<div class="card">

<div class="title">
<i class="fa-solid fa-file-lines"></i>
{{ report.displayname }}
</div>

<div class="report-preview">
<img
class="report-image"
src="/uploadimg/{{ report.path }}"
alt="{{ report.displayname }}">
</div>

<textarea
id="add-query-{{report.id}}"
placeholder="Write your AI instructions here..."></textarea>

<div class="actions">

<a
href="/report/process/{{ report.id }}"
class="btn process">
<i class="fa-solid fa-gears"></i>
Process Report
</a>

<button
class="btn query"
onclick="addQuery('{{ report.id }}')">
<i class="fa-solid fa-floppy-disk"></i>
Save Query
</button>

<a
href="/report/generate-geminie/{{ report.id }}"
class="btn generate">
<i class="fa-solid fa-wand-magic-sparkles"></i>
Generate Report
</a>

</div>

</div>

{% endfor %}

{% else %}

<div class="card" style="text-align:center">
<h2>No Reports Available</h2>
<p>Upload a report to start processing.</p>
</div>

{% endif %}

</div>

<div id="toast" class="toast"></div>

<script>
function toast(msg,color){
const t=document.getElementById("toast");
t.innerHTML=msg;
t.style.background=color;
t.style.display="block";
setTimeout(()=>t.style.display="none",2500);
}

function addQuery(reportId){
const query=document.getElementById(`add-query-${reportId}`).value;

fetch(`/report/add-query/${reportId}`,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({query:query})
})
.then(r=>r.json())
.then(data=>{
if(data.status==="success"){
toast("✔ "+data.message,"#16a34a");
setTimeout(()=>location.reload(),1200);
}else{
toast("Failed to save query","#dc2626");
}
})
.catch(()=>{
toast("Server Error","#dc2626");
});
}
</script>

</body>
</html>
