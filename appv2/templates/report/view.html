<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Page</title>
</head>
<body>
    <div>
        <h1>Welcome to the View Page</h1>
        {% for report in reports %}
            <div>
                <h2>{{ report.displayname }}</h2>
                <img src="/uploadimg/sample.png" alt="{{ report.displayname }}" style="width: 100%; max-width: 600px; border-radius: 10px;">
            </div>
        {% endfor %}

    </div>
</body>
</html>
