<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Page</title>
</head>
<body>
    <div>
        <h1>Welcome to the View Page</h1>
        {% for report in reports %}
            <div>
                <h2>{{ report.displayname }}</h2>
                <img src="/uploadimg/{{ report.path }}" alt="{{ report.displayname }}" style="width: 100%; max-width: 600px; border-radius: 10px;">
                <br>
                <button><a href="/report/process/{{ report.id }}">Process Report</a></button><br>
                <button><a href="/report/generate/{{ report.id }}">Generate Report</a></button>
                <button><a href="/report/generate-ocr/{{ report.id }}">Generate Report Ocr</a></button>
                <button><a href="/report/generate-geminie/{{ report.id }}">Generate Report Geminie</a></button>
                <hr>
            </div>
        {% endfor %}

    </div>
</body>
</html>
