<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Upload Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{
min-height:100vh;
background:linear-gradient(135deg,#0f172a,#1e3a8a,#312e81);
display:flex;justify-content:center;align-items:center;padding:30px}
.card{
width:min(920px,100%);
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.15);
border-radius:22px;
padding:30px;
color:#fff;
box-shadow:0 20px 60px rgba(0,0,0,.35)}
h1{font-size:2rem}
.sub{opacity:.75;margin:8px 0 25px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
label{display:block;font-size:.9rem;margin-bottom:6px}
input[type=text],select{
width:100%;padding:12px 14px;border:none;border-radius:12px;
background:rgba(255,255,255,.08);color:#fff}
input::placeholder{color:#ddd}
.drop{
margin-top:20px;border:2px dashed #7c3aed;border-radius:18px;
padding:40px;text-align:center;cursor:pointer;
transition:.3s;background:rgba(255,255,255,.04)}
.drop.drag{background:rgba(124,58,237,.15);transform:scale(1.01)}
.icon{font-size:56px}
.fileCard{
margin-top:18px;padding:14px;border-radius:14px;
background:rgba(255,255,255,.08);
display:flex;justify-content:space-between;align-items:center}
button{
margin-top:25px;width:100%;padding:15px;border:none;
border-radius:14px;font-size:1rem;font-weight:600;
background:linear-gradient(135deg,#7c3aed,#2563eb);
color:#fff;cursor:pointer;transition:.3s}
button:hover{transform:translateY(-2px)}
button:disabled{opacity:.5;cursor:not-allowed}
.progress{height:8px;background:#334155;border-radius:50px;margin-top:16px;display:none}
.bar{height:100%;width:0;background:#22c55e;border-radius:50px;transition:.2s}
.radio{display:flex;gap:15px;align-items:center;padding-top:28px}
small{opacity:.8}
.remove{
background:#ef4444;color:#fff;border:none;border-radius:8px;padding:8px 10px;
cursor:pointer;width:auto;margin:0}
</style>
</head>
<body>
<div class="card">
<h1>📤 Upload Report</h1>
<p class="sub">Configure report settings and upload your source file.</p>

<form action="/report/upload" method="post" enctype="multipart/form-data" id="uploadForm">

<div class="grid">
<div>
<label>Report Name</label>
<input id="reportname" name="reportname" type="text" placeholder="Report Name" required>
</div>

<div class="radio">
<label><input type="radio" name="correction" value="yes"> Yes</label>
<label><input checked type="radio" name="correction" value="no"> No</label>
</div>

<div>
<label>Page Size</label>
<select name="pagesize">
<option>A4</option><option>A3</option>
<option>Letter</option><option>Legal</option>
</select>
</div>

<div>
<label>Orientation</label>
<select name="orientation">
<option value="portrait">Portrait</option>
<option value="landscape">Landscape</option>
</select>
</div>

<div>
<label>Report Type</label>
<select id="report_type" name="report_type">
<option value="pdf">PDF</option>
<option value="xls">Excel</option>
<option value="html">HTML</option>
<option value="jrxml">JRXML</option>
</select>
</div>
</div>

<input hidden id="samplefile" name="samplefile" type="file" accept=".csv,.json,.xlsx,.xls,.pdf,.png,.jpg,.jpeg,.jrxml">

<div id="drop" class="drop">
<div class="icon">☁️</div>
<h3>Drag & Drop</h3>
<p>or click to browse files</p>
<small>PDF, XLS, XLSX, PNG, JPG, JPEG, CSV, JSON, JRXML</small>
<div id="fileContainer"></div>
</div>

<div class="progress" id="progress"><div class="bar" id="bar"></div></div>

<button id="uploadBtn" disabled>Upload Report</button>

</form>
</div>

<script>
const valid=["pdf","xls","xlsx","png","jpg","jpeg","csv","json","jrxml"];
const fileInput=document.getElementById("samplefile");
const drop=document.getElementById("drop");
const container=document.getElementById("fileContainer");
const report=document.getElementById("reportname");
const btn=document.getElementById("uploadBtn");

drop.onclick=()=>fileInput.click();

["dragenter","dragover"].forEach(e=>drop.addEventListener(e,x=>{
x.preventDefault();drop.classList.add("drag");
}));
["dragleave","drop"].forEach(e=>drop.addEventListener(e,x=>{
x.preventDefault();drop.classList.remove("drag");
}));

drop.addEventListener("drop",e=>{
if(e.dataTransfer.files.length){
fileInput.files=e.dataTransfer.files;
handle(e.dataTransfer.files[0]);
}
});

fileInput.onchange=e=>handle(e.target.files[0]);

function handle(file){
if(!file)return;
let parts=file.name.split(".");
let ext=parts.pop().toLowerCase();
if(!valid.includes(ext)){
container.innerHTML="<p style='color:#ff8080'>❌ Invalid File Type</p>";
btn.disabled=true;
return;
}
report.value=parts.join(".");
if(ext==="jrxml")document.getElementById("report_type").value="jrxml";
container.innerHTML=`
<div class="fileCard">
<div>
<b>${file.name}</b><br>
<small>${(file.size/1024).toFixed(2)} KB</small>
</div>
<button type="button" class="remove" onclick="removeFile()">🗑</button>
</div>`;
btn.disabled=false;
}

function removeFile(){
fileInput.value="";
container.innerHTML="";
report.value="";
btn.disabled=true;
}

document.getElementById("uploadForm").onsubmit=function(e){
if(!fileInput.files.length){
e.preventDefault();
alert("Please select a file.");
return;
}
const p=document.getElementById("progress");
const b=document.getElementById("bar");
p.style.display="block";
let w=0;
let t=setInterval(()=>{
w+=5;
b.style.width=w+"%";
if(w>=100)clearInterval(t);
},40);
};
</script>
</body>
</html>
